version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Minor and patch updates are merged if CI is green. **Major** ones are not:
    # a major of TypeScript or of a linter is not a bump, it is a decision that
    # belongs to a person. A failed major PR every week is noise that covers the
    # real PRs.
    versioning-strategy: increase
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: typescript-eslint
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
